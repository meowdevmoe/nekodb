# Example nginx server block: the static site from apps/web/out plus the API on :3741.
server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.example;
    root /var/www/nekodb;          # contents of apps/web/out

    location ^~ /api/            { proxy_pass http://127.0.0.1:3741; include /etc/nginx/nekodb-proxy.conf; }
    location ^~ /card/           { proxy_pass http://127.0.0.1:3741; include /etc/nginx/nekodb-proxy.conf; }
    location ^~ /spotify/        { proxy_pass http://127.0.0.1:3741; include /etc/nginx/nekodb-proxy.conf; }
    location ^~ /github/         { proxy_pass http://127.0.0.1:3741; include /etc/nginx/nekodb-proxy.conf; }
    location ^~ /counter/        { proxy_pass http://127.0.0.1:3741; include /etc/nginx/nekodb-proxy.conf; }
    location ^~ /counter-preview { proxy_pass http://127.0.0.1:3741; include /etc/nginx/nekodb-proxy.conf; }
    location ^~ /@               { proxy_pass http://127.0.0.1:3741; include /etc/nginx/nekodb-proxy.conf; }
    location / { try_files $uri $uri/ $uri.html =404; }
}


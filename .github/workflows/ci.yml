name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @nekodb/api
      - run: npm run build -w @nekodb/api
      - run: npx tsc -p apps/web/tsconfig.json --noEmit
      - run: npm run build -w @nekodb/web
